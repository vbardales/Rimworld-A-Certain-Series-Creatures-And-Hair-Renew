name: Mod regression tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  xml-regressions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check XML and gameplay contracts
        shell: powershell
        run: ./Tests/Test-Mod.ps1
      - name: Check English and French text coverage
        shell: powershell
        run: ./Tests/Test-Translations.ps1
